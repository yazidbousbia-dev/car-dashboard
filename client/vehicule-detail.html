<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détails du véhicule — AutoWeex</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/client.css">
</head>
<body class="aw">

<div id="awNav" class="aw-nav"></div>

<div class="aw-page-header" style="padding-bottom:40px">
  <div class="aw-container">
    <div class="aw-breadcrumb"><a href="index.html">Accueil</a><span class="sep">/</span><a href="vehicules.html">Véhicules</a><span class="sep">/</span><span id="bcTitle">…</span></div>
  </div>
</div>

<section class="aw-section" style="padding-top:36px">
  <div class="aw-container" id="detailWrap">
    <div class="aw-spinner"></div>
  </div>
</section>

<!-- Véhicules similaires -->
<section class="aw-section" style="background:var(--noir-2)">
  <div class="aw-container">
    <div class="aw-section-head">
      <div>
        <div class="aw-eyebrow">Vous aimerez aussi</div>
        <h2 class="aw-title">Véhicules <em>similaires</em></h2>
      </div>
    </div>
    <div class="aw-cars-grid" id="relatedGrid"></div>
  </div>
</section>

<div id="awFooter" class="aw-footer"></div>

<script src="../js/utils.js"></script>
<script src="js/client.js"></script>
<script>
  awRenderNav('vehicules.html');

  const carId = new URLSearchParams(window.location.search).get('id');

  awFetchCars().then(cars => {
    const car = cars.find(c => String(c.id) === String(carId)) || cars[0];
    if (!car) {
      document.getElementById('detailWrap').innerHTML = `<div class="aw-empty"><i class="ti ti-car-off"></i><h3>Véhicule introuvable</h3><p>Il a peut-être été vendu ou retiré du catalogue.</p><br><a href="vehicules.html" class="aw-btn aw-btn-gold">Retour au catalogue</a></div>`;
      return;
    }
    document.title = `${car.brand} ${car.model} — AutoWeex`;
    document.getElementById('bcTitle').textContent = `${car.brand} ${car.model}`;

    const images = car.images && car.images.length ? car.images : (car.image ? [car.image] : []);
    const mainMedia = images.length
      ? `<img src="${images[0]}" alt="${car.brand} ${car.model}" id="mainImg">`
      : `<i class="ti ${car.glyph || 'ti-car'}"></i>`;
    const thumbs = images.length > 1
      ? `<div class="aw-gallery-thumbs">${images.map((img, i) => `<div class="thumb ${i === 0 ? 'active' : ''}" data-img="${img}"><img src="${img}"></div>`).join('')}</div>`
      : '';

    const isFav = AwFav.isFav(car.id);

    document.getElementById('detailWrap').innerHTML = `
      <div class="aw-detail-grid">
        <div>
          <div class="aw-gallery-main">${mainMedia}</div>
          ${thumbs}
          <div class="aw-desc-block">
            <h3 style="font-family:var(--font-display);font-weight:400;color:var(--blanc);font-size:20px;margin-bottom:10px">Description</h3>
            <p>${car.description || `Ce ${car.brand} ${car.model} ${car.year} a été inspecté par notre équipe et répond à nos critères de qualité et de fiabilité. Contactez-nous pour organiser un essai routier ou obtenir plus de détails sur son historique.`}</p>
          </div>
        </div>
        <div class="aw-detail-side">
          <div class="aw-price-card">
            <div class="cond" style="display:flex;justify-content:space-between;align-items:center">
              <span>${car.brand} · ${car.model}</span>
              <button class="aw-fav-heart ${isFav ? 'active' : ''}" data-fav-toggle="${car.id}" style="position:static"><i class="ti ${isFav ? 'ti-heart-filled' : 'ti-heart'}"></i></button>
            </div>
            <div class="price">${Number(car.price).toLocaleString('fr-DZ')} DA</div>
            <div class="cond">${car.condition === 'neuve' ? 'Véhicule neuf' : "Véhicule d'occasion"} · ${car.year}</div>

            <div class="aw-spec-list">
              <div class="aw-spec-item"><span>Kilométrage</span><b>${car.mileage != null ? Number(car.mileage).toLocaleString('fr-DZ') + ' km' : '—'}</b></div>
              <div class="aw-spec-item"><span>Carburant</span><b>${(typeof FUEL_LABELS !== 'undefined' && FUEL_LABELS[car.fuel_type]) || car.fuel_type}</b></div>
              <div class="aw-spec-item"><span>Transmission</span><b>${(typeof TRANSMISSION_LABELS !== 'undefined' && TRANSMISSION_LABELS[car.transmission]) || car.transmission}</b></div>
              <div class="aw-spec-item"><span>État</span><b>${(typeof CONDITION_LABELS !== 'undefined' && CONDITION_LABELS[car.condition]) || car.condition}</b></div>
            </div>

            <a href="a-propos.html#contact" class="aw-btn aw-btn-gold aw-btn-block"><i class="ti ti-message-circle"></i> Faire une demande</a>
            <a href="tel:+213555000000" class="aw-btn aw-btn-outline aw-btn-block" style="margin-top:10px"><i class="ti ti-phone"></i> Appeler le vendeur</a>

            <div class="aw-dealer-card">
              <div class="aw-dealer-avatar"><i class="ti ti-building-store"></i></div>
              <div>
                <b style="display:block;font-size:13.5px;color:var(--blanc)">AutoWeex Showroom</b>
                <span style="font-size:12px;color:var(--texte-sub)">Vendeur vérifié · Taher, Jijel</span>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    // Galerie : changer l'image principale au clic sur une miniature
    document.querySelectorAll('.aw-gallery-thumbs .thumb').forEach(t => {
      t.addEventListener('click', () => {
        document.getElementById('mainImg').src = t.dataset.img;
        document.querySelectorAll('.aw-gallery-thumbs .thumb').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      });
    });

    // Véhicules similaires (même marque, ou à défaut les autres)
    const related = cars.filter(c => c.id !== car.id && c.brand === car.brand);
    const relatedList = (related.length ? related : cars.filter(c => c.id !== car.id)).slice(0, 3);
    const relGrid = document.getElementById('relatedGrid');
    relGrid.innerHTML = relatedList.map(awCarCard).join('');
    awObserveNew(relGrid);
  });
</script>
</body>
</html>
