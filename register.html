<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoWeex — Créer un compte</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="css/client.css">
  <style>
    body.aw {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(ellipse 55% 50% at 80% 15%, rgba(158,27,43,.2), transparent 60%),
        radial-gradient(ellipse 45% 40% at 10% 90%, rgba(201,162,39,.14), transparent 60%),
        var(--noir);
    }
    .auth-wrap { width: 100%; max-width: 440px; }
    .auth-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--texte-sub); margin-bottom: 18px; }
    .auth-back:hover { color: var(--or); }
    .auth-card { background: var(--surface); border: 1px solid var(--ligne); border-radius: 18px; padding: 34px 30px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .auth-head { text-align: center; margin-bottom: 26px; }
    .auth-icon { width: 50px; height: 50px; border-radius: 13px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--noir); background: linear-gradient(135deg, var(--or-clair), var(--rouge)); }
    .auth-title { font-family: var(--font-display); font-size: 22px; color: var(--blanc); margin-bottom: 4px; }
    .auth-sub { font-size: 13px; color: var(--texte-sub); }
    .auth-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .auth-group { margin-bottom: 15px; }
    .auth-group label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--texte-muted); margin-bottom: 6px; }
    .auth-group input {
      width: 100%; background: var(--noir-3); border: 1px solid var(--ligne); border-radius: 9px;
      padding: 11px 13px; color: var(--blanc); font-size: 13.8px; outline: none; transition: border-color .18s;
    }
    .auth-group input:focus { border-color: var(--or); }
    .auth-group input.input-error { border-color: var(--rouge-clair); }
    .auth-err {
      background: rgba(158,27,43,.14); color: #ff9aa3; border: 1px solid rgba(158,27,43,.4);
      border-radius: 9px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
      display: none; align-items: center; gap: 8px;
    }
    .auth-err.show { display: flex; }
    .auth-foot { text-align: center; font-size: 13px; color: var(--texte-sub); margin-top: 20px; }
    .auth-foot a { color: var(--or); font-weight: 600; }
  </style>
</head>
<body class="aw">
<div class="auth-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <a href="index.html" class="auth-back" style="margin-bottom:0"><i class="ti ti-arrow-left"></i> <span data-i18n="auth.back">Retour au site</span></a>
    <div style="display:flex;gap:8px;align-items:center"><div id="authLangSwitch"></div><div id="authThemeToggle"></div></div>
  </div>
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-icon"><i class="ti ti-user-plus"></i></div>
      <div class="auth-title" data-i18n="auth.registerTitle">Créer un compte</div>
      <div class="auth-sub" data-i18n="auth.registerSub">Suivez vos demandes et retrouvez vos favoris</div>
    </div>

    <div id="errMsg" class="auth-err">
      <i class="ti ti-alert-circle" style="font-size:16px;flex-shrink:0"></i>
      <span id="errText"></span>
    </div>

    <div class="auth-group">
      <label data-i18n="auth.name">Nom complet</label>
      <input id="name" type="text" placeholder="Votre nom" autocomplete="name">
    </div>
    <div class="auth-row">
      <div class="auth-group">
        <label data-i18n="auth.email">Email</label>
        <input id="email" type="email" placeholder="vous@exemple.com" autocomplete="email">
      </div>
      <div class="auth-group">
        <label data-i18n="auth.phone">Téléphone</label>
        <input id="phone" type="tel" placeholder="0X XX XX XX XX" autocomplete="tel">
      </div>
    </div>
    <div class="auth-row">
      <div class="auth-group">
        <label data-i18n="auth.password">Mot de passe</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="auth-group">
        <label data-i18n="auth.confirm">Confirmer</label>
        <input id="passwordConfirm" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
    </div>

    <button id="registerBtn" class="aw-btn aw-btn-gold aw-btn-block" onclick="doRegister()">
      <i class="ti ti-user-plus"></i> <span data-i18n="auth.submitRegister">Créer mon compte</span>
    </button>

    <div class="auth-foot"><span data-i18n="auth.alreadyClient">Déjà client ?</span> <a href="login.html" data-i18n="auth.login2">Se connecter</a></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script>document.getElementById('authLangSwitch').innerHTML = langSwitcherHTML();
document.getElementById('authThemeToggle').innerHTML = themeToggleHTML();</script>
<script>
Auth.redirectIfLoggedIn();

const params = new URLSearchParams(window.location.search);
const redirectTo = params.get('redirect');

document.getElementById('passwordConfirm').addEventListener('keydown', e => {
  if (e.key === 'Enter') doRegister();
});

function showError(msg) {
  const box = document.getElementById('errMsg');
  document.getElementById('errText').textContent = msg;
  box.classList.remove('show'); void box.offsetWidth; box.classList.add('show');
}
function clearError() { document.getElementById('errMsg').classList.remove('show'); }

async function doRegister() {
  clearError();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;

  if (!name || !email || !password) {
    showError('Merci de remplir tous les champs obligatoires.');
    return;
  }
  if (password !== passwordConfirm) {
    showError('Les mots de passe ne correspondent pas.');
    return;
  }

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> Création…';

  try {
    // Le endpoint public /register crée toujours un compte de rôle "user" (client) — jamais admin/secretaire.
    const res = await api('POST', '/register', {
      name, email, phone: phone || null,
      password, password_confirmation: passwordConfirm,
    });
    Auth.save(res.token, res.user);
    window.location.href = redirectTo || 'index.html';
  } catch (e) {
    showError(e.message || "Impossible de créer le compte. Vérifiez vos informations.");
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-user-plus"></i> Créer mon compte';
  }
}
</script>
</body>
</html>
